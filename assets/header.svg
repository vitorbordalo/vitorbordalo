<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Vitor Bordalo, AI Builder">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ff3b2f" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c0"><rect x="60" y="232" height="50" width="0"><animate attributeName="width" values="0;760;760;0;0" keyTimes="0;.14;.29;.33;1" dur="9s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c1"><rect x="60" y="232" height="50" width="0"><animate attributeName="width" values="0;760;760;0;0" keyTimes="0;.14;.29;.33;1" dur="9s" begin="3s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="232" height="50" width="0"><animate attributeName="width" values="0;760;760;0;0" keyTimes="0;.14;.29;.33;1" dur="9s" begin="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="frame"><rect width="1200" height="400" rx="28"/></clipPath>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; letter-spacing: .5px; }
      .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
      @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
      .live { animation: ping 1.8s ease-out infinite; transform-origin: 74px 52px; }
      @keyframes ping { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .road { animation: road 1.2s linear infinite; }
      @keyframes road { to { stroke-dashoffset: -48; } }
      .badge { animation: spin 16s linear infinite; transform-origin: 1066px 196px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0f0d0c"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <!-- status -->
    <g class="rise d1">
      <circle class="live" cx="74" cy="52" r="5" fill="#3ddc84"/>
      <circle cx="74" cy="52" r="5" fill="#3ddc84"/>
      <text x="90" y="57" class="mono" font-size="14" fill="#8f8680">DISPONÍVEL · ESTÁGIO GENAI 2026 · SÃO PAULO</text>
    </g>

    <!-- nome -->
    <g class="rise d2">
      <text x="56" y="190" class="sans" font-size="124" font-weight="800" fill="#f4efe6" letter-spacing="-5">Vitor</text>
      <text x="400" y="190" class="serif" font-size="128" fill="#ff3b2f" letter-spacing="-3">Bordalo</text>
    </g>

    <!-- selo giratório -->
    <g class="rise d3">
      <g class="badge">
        <circle cx="1066" cy="196" r="62" fill="none" stroke="#f4efe6" stroke-opacity=".18"/>
        <path id="ring" d="M1066,196 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0" fill="none"/>
        <text class="mono" font-size="11.5" fill="#f4efe6" letter-spacing="2.2"><textPath href="#ring">AI BUILDER · AI BUILDER · AI BUILDER ·</textPath></text>
      </g>
      <text x="1066" y="206" text-anchor="middle" class="serif" font-size="30" fill="#ff3b2f">vb</text>
    </g>

    <!-- linha digitando -->
    <g class="rise d4">
      <text x="60" y="268" class="mono" font-size="26" fill="#ff3b2f">&gt;</text>
      <g transform="translate(26 0)">
        <text clip-path="url(#c0)" x="60" y="268" class="mono" font-size="26" fill="#f4efe6">construo produtos com IA, do problema ao deploy</text>
        <text clip-path="url(#c1)" x="60" y="268" class="mono" font-size="26" fill="#f4efe6">orquestro equipes de agentes (Claude, GPT, Gemini)</text>
        <text clip-path="url(#c2)" x="60" y="268" class="mono" font-size="26" fill="#f4efe6">do Direito ao código: falo negócio, jurídico e tech</text>
      </g>
    </g>

    <!-- estrada + moto -->
    <line x1="0" y1="352" x2="1200" y2="352" stroke="#f4efe6" stroke-opacity=".16" stroke-width="2" stroke-dasharray="24 24" class="road"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-90 0;1290 0" dur="7s" repeatCount="indefinite"/>
      <rect x="-6" y="306" width="34" height="28" rx="6" fill="#ff3b2f"/>
      <text x="11" y="326" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#0f0d0c">vb</text>
      <path d="M30 336 h28 l10 -16 h-12" fill="none" stroke="#f4efe6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 336 h28" stroke="#f4efe6" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="8" cy="342" r="9" fill="none" stroke="#f4efe6" stroke-width="3.5"/>
      <circle cx="64" cy="342" r="9" fill="none" stroke="#f4efe6" stroke-width="3.5"/>
      <path d="M-20 322 h-26 M-14 332 h-40 M-24 342 h-20" stroke="#ff3b2f" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="1144" y="388" text-anchor="end" class="mono" font-size="12" fill="#5f5853">PEDIDO #VB-2026 · SAIU PARA ENTREGA</text>
  </g>
</svg>
