<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rastreio: Direito na UNDB em 2022, Engenharia de Software em 2024, empresa B2B, FIAP em 2025, efetivado em 2026, próxima parada iFood">
  <defs>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; letter-spacing: .5px; }
      .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    </style>
    <clipPath id="frame"><rect width="1200" height="300" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#f4efe6"/>
    <text x="56" y="56" class="mono" font-size="14" fill="#d91f14">RASTREIO DO PEDIDO #VB-2026</text>
    <text x="1144" y="56" text-anchor="end" class="mono" font-size="14" fill="#5f5853">São Luís, MA → São Paulo, SP</text>

    <!-- trilho -->
    <line x1="100" y1="140" x2="1100" y2="140" stroke="#0f0d0c" stroke-opacity=".14" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="140" x2="1100" y2="140" stroke="#ff3b2f" stroke-width="4" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;.8;.95;1" dur="10s" repeatCount="indefinite"/>
    </line>

    <!-- paradas: x = 100, 300, 500, 700, 900, 1100 -->
    <g class="sans">
      <g>
        <circle cx="100" cy="140" r="11" fill="#f4efe6" stroke="#0f0d0c" stroke-width="3"><animate attributeName="fill" values="#f4efe6;#ff3b2f;#ff3b2f;#f4efe6" keyTimes="0;.01;.95;1" dur="10s" repeatCount="indefinite"/></circle>
        <text x="100" y="190" text-anchor="middle" class="mono" font-size="12" fill="#5f5853">2022 · SÃO LUÍS</text>
        <text x="100" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#0f0d0c">Direito</text>
        <text x="100" y="242" text-anchor="middle" font-size="14" fill="#5f5853">UNDB</text>
      </g>
      <g>
        <circle cx="300" cy="140" r="11" fill="#f4efe6" stroke="#0f0d0c" stroke-width="3"><animate attributeName="fill" values="#f4efe6;#f4efe6;#ff3b2f;#ff3b2f;#f4efe6" keyTimes="0;.16;.17;.95;1" dur="10s" repeatCount="indefinite"/></circle>
        <text x="300" y="190" text-anchor="middle" class="mono" font-size="12" fill="#5f5853">2024 · A VIRADA</text>
        <text x="300" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#0f0d0c">Eng. de Software</text>
        <text x="300" y="242" text-anchor="middle" font-size="14" fill="#5f5853">+ estágio no TCE-MA</text>
      </g>
      <g>
        <circle cx="500" cy="140" r="11" fill="#f4efe6" stroke="#0f0d0c" stroke-width="3"><animate attributeName="fill" values="#f4efe6;#f4efe6;#ff3b2f;#ff3b2f;#f4efe6" keyTimes="0;.32;.33;.95;1" dur="10s" repeatCount="indefinite"/></circle>
        <text x="500" y="190" text-anchor="middle" class="mono" font-size="12" fill="#5f5853">EMPREENDER</text>
        <text x="500" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#0f0d0c">Sócio-fundador</text>
        <text x="500" y="242" text-anchor="middle" font-size="14" fill="#5f5853">software B2B</text>
      </g>
      <g>
        <circle cx="700" cy="140" r="11" fill="#f4efe6" stroke="#0f0d0c" stroke-width="3"><animate attributeName="fill" values="#f4efe6;#f4efe6;#ff3b2f;#ff3b2f;#f4efe6" keyTimes="0;.48;.49;.95;1" dur="10s" repeatCount="indefinite"/></circle>
        <text x="700" y="190" text-anchor="middle" class="mono" font-size="12" fill="#5f5853">2025 · SÃO PAULO</text>
        <text x="700" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#0f0d0c">FIAP</text>
        <text x="700" y="242" text-anchor="middle" font-size="14" fill="#5f5853">2º lugar HACK OPS 2026</text>
      </g>
      <g>
        <circle cx="900" cy="140" r="11" fill="#f4efe6" stroke="#0f0d0c" stroke-width="3"><animate attributeName="fill" values="#f4efe6;#f4efe6;#ff3b2f;#ff3b2f;#f4efe6" keyTimes="0;.64;.65;.95;1" dur="10s" repeatCount="indefinite"/></circle>
        <text x="900" y="190" text-anchor="middle" class="mono" font-size="12" fill="#5f5853">2026</text>
        <text x="900" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#0f0d0c">Estágio → CLT</text>
        <text x="900" y="242" text-anchor="middle" font-size="14" fill="#5f5853">Suporte de TI · FIAP</text>
      </g>
      <g>
        <circle cx="1100" cy="140" r="15" fill="#ff3b2f" fill-opacity=".18"><animate attributeName="r" values="12;24;12" dur="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="1100" cy="140" r="11" fill="#f4efe6" stroke="#ff3b2f" stroke-width="3"><animate attributeName="fill" values="#f4efe6;#f4efe6;#ff3b2f;#ff3b2f;#f4efe6" keyTimes="0;.79;.8;.95;1" dur="10s" repeatCount="indefinite"/></circle>
        <text x="1100" y="190" text-anchor="middle" class="mono" font-size="12" fill="#d91f14">PRÓXIMA PARADA</text>
        <text x="1100" y="222" text-anchor="middle" class="serif" font-size="28" fill="#d91f14">iFood?</text>
      </g>
    </g>

    <!-- moto -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="100 0;1100 0;1100 0;100 0" keyTimes="0;.8;.95;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="0" cy="96" r="24" fill="#ff3b2f"/>
      <g transform="translate(-12 84)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h3l3 6.5M5.5 17.5 9 10h6l3.5 7.5M9 10 7.5 6H5"/>
      </g>
      <path d="M0 120 v10" stroke="#ff3b2f" stroke-width="2"/>
    </g>
  </g>
</svg>
