name: Jogo da velha

on:
  issues:
    types: [opened]

# uma jogada por vez, na ordem em que chegaram
concurrency:
  group: tictactoe
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    # só processa issues de jogada; qualquer outra issue é ignorada
    if: startsWith(github.event.issue.title, 'ttt|move|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # sempre o estado mais recente do branch, não o do momento do evento
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Processa a jogada
        id: game
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ttt = require('./.github/scripts/ttt.js');
            const issue = context.payload.issue;
            const statePath = 'game/state.json';
            let state;
            try { state = JSON.parse(fs.readFileSync(statePath, 'utf8')); } catch { state = ttt.newState(); }

            const { ok, reply } = ttt.handle(issue.title, issue.user.login, state);
            if (ok) {
              fs.mkdirSync('game', { recursive: true });
              fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
              const readme = fs.readFileSync('README.md', 'utf8');
              fs.writeFileSync('README.md', ttt.inject(readme, ttt.render(state, `${context.repo.owner}/${context.repo.repo}`)));
            }
            core.setOutput('changed', ok ? 'true' : 'false');
            core.setOutput('reply', reply || '');

      - name: Salva o tabuleiro
        if: steps.game.outputs.changed == 'true'
        run: |
          git config user.name "vitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git commit -m "🎮 nova jogada no jogo da velha"
          for i in 1 2 3; do git push && exit 0; sleep 3; git pull --rebase; done
          exit 1

      # só responde depois que a jogada foi salva (ou se não havia nada a salvar)
      - name: Responde e fecha a issue
        if: success()
        uses: actions/github-script@v7
        env:
          REPLY: ${{ steps.game.outputs.reply }}
          CHANGED: ${{ steps.game.outputs.changed }}
        with:
          script: |
            const n = context.payload.issue.number;
            if (process.env.REPLY) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: n, body: process.env.REPLY });
            }
            await github.rest.issues.update({ ...context.repo, issue_number: n, state: 'closed', state_reason: process.env.CHANGED === 'true' ? 'completed' : 'not_planned' });

      - name: Avisa se deu erro
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.issue.number,
              body: 'Ops, o bot tropeçou nessa jogada 😅. Volte ao perfil e tente de novo: https://github.com/vitorbordalo' });
            await github.rest.issues.update({ ...context.repo, issue_number: context.payload.issue.number, state: 'closed', state_reason: 'not_planned' });
